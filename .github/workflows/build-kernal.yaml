# GitHub Actions workflow: build the NetHunter kernel and automatically publish
# the build artifacts to a GitHub Release:
#   - Image.xz                 built kernel image
#   - boot.img                 Android boot image (header v2: Image+DTB+initramfs)
#   - dtbo.img                 device tree overlay table
#   - linux-headers-*-arm64.deb  DKMS kernel headers package (for arm64 Kali chroot)
#   - kernel-headers.zip       kernel headers (for out-of-tree module builds)
#   - initramfs_data.cpio.gz   kernel initramfs generated by the build
#   - nethunter-kernel-NetHunter.zip  NetHunter AnyKernel3 zip (Image+dtbo+modules,
#                                     flashable in TWRP or installable in Magisk Manager)
#   - nethunter-kernel-nairo-magisk.zip  Magisk module zip (Image+dtbo+modules;
#                                     install from Magisk Manager, preserves the
#                                     Magisk patch by repacking the boot ramdisk)
#
# Triggers:
#   - push to lineage-22.2
#   - semver tag (vX.Y.Z)
#   - manual workflow_dispatch
#
# On branch pushes an auto-tag `v<version>-<YYYYmmddHHMMSS>` is created for the
# build and the release is published under it. The tag itself is auto-created
# by `gh release create --target` (REST API) rather than git-pushed, so it is
# not blocked by GitHub's `workflows`-permission rule (see Auto-tag step).
# Runs triggered by a pushed tag use that tag verbatim for the release.

name: build-kernel

on:
  push:
    branches: [lineage-22.2]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# GITHUB_TOKEN cannot be granted the `workflows` permission (it is a GitHub App
# token), so git pushes of tags pointing at commits that modify
# .github/workflows/* are refused. The auto-tag is therefore created via the
# REST API in the publish step instead of `git push`.
permissions:
  contents: write

env:
  # Used by the `gh` CLI to create/upload releases. GITHUB_TOKEN is
  # auto-provisioned with the `contents: write` scope declared above.
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ===================== TOOLCHAIN =====================
      # Tools used to build the image artifacts:
      #   - python3            for scripts/mkbootimg.py and scripts/mkdtboimg.py
      #   - zip                for the NetHunter (AnyKernel3) zip
      #   - dpkg/dpkg-deb      for the linux-headers deb package
      # mkdtboimg/mkbootimg are vendored in scripts/, so no extra python deps.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential clang cpio dpkg dpkg-dev flex git kmod \
            libelf-dev libssl-dev llvm lld python3 unzip wget xz-utils zip

      # compile.sh hardcodes /opt/android-ndk-r16b (aarch64-linux-android-4.9
      # GCC binutils for CROSS_COMPILE). The NDK version must match.
      - name: Install Android NDK r16b
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r16b-linux-x86_64.zip
          sudo unzip -q android-ndk-r16b-linux-x86_64.zip -d /opt
          rm -f android-ndk-r16b-linux-x86_64.zip
          test -d /opt/android-ndk-r16b

      # ===================== BUILD =====================
      # continue-on-error: a failed build must not block packaging + publish,
      # which still run with whatever artifacts were produced.
      - name: Build kernel (compile.sh)
        continue-on-error: true
        run: |
          sudo ./compile.sh

      # ===================== PACKAGE RELEASE ARTIFACTS =====================
      # Assemble ./dist with the artifacts produced by compile.sh so the publish
      # step below can upload them to the GitHub Release.
      - name: Package release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          # NetHunter flashable zip (kernel + dtbo + modules)
          if [[ -f output/nethunter-kernel-NetHunter.zip ]]; then
            cp output/nethunter-kernel-NetHunter.zip dist/nethunter-kernel-NetHunter.zip
          else
            echo "[-] output/nethunter-kernel-NetHunter.zip missing (build may have failed)"
          fi

          # Magisk-module kernel zip (installs from Magisk Manager, preserves Magisk)
          if [[ -f output/nethunter-kernel-nairo-magisk.zip ]]; then
            cp output/nethunter-kernel-nairo-magisk.zip dist/nethunter-kernel-nairo-magisk.zip
          else
            echo "[-] output/nethunter-kernel-nairo-magisk.zip missing (build may have failed)"
          fi

          # Kernel headers as a zip (for out-of-tree module builds)
          if [[ -d out/kernel-headers ]]; then
            (cd out && zip -rq ../dist/kernel-headers.zip kernel-headers)
          else
            echo "[-] out/kernel-headers missing (build may have failed)"
          fi

          # Built kernel image + device tree blob
          if [[ -f out/arch/arm64/boot/Image.xz ]]; then
            cp out/arch/arm64/boot/Image.xz dist/Image.xz
          else
            echo "[-] out/arch/arm64/boot/Image.xz missing"
          fi
          if [[ -f out/arch/arm64/boot/dtbo.img ]]; then
            cp out/arch/arm64/boot/dtbo.img dist/dtbo.img
          else
            echo "[-] out/arch/arm64/boot/dtbo.img missing"
          fi

          # boot.img (Android boot image header v2: Image + dtb.img + initramfs)
          if [[ -f out/arch/arm64/boot/boot.img ]]; then
            cp out/arch/arm64/boot/boot.img dist/boot.img
          else
            echo "[-] out/arch/arm64/boot/boot.img missing"
          fi

          # DKMS linux-headers package (built by compile.sh into output/)
          if compgen -G 'output/linux-headers-*-arm64.deb' >/dev/null; then
            cp output/linux-headers-*-arm64.deb dist/
          else
            echo "[-] linux-headers deb missing (dpkg-deb unavailable?)"
          fi

          # initramfs produced by the kernel build (usr/initramfs_data.cpio*)
          if compgen -G 'out/usr/initramfs_data.cpio*' >/dev/null; then
            cp out/usr/initramfs_data.cpio* dist/
          else
            echo "[-] initramfs missing (CONFIG_BLK_DEV_INITRD disabled?)"
          fi

          echo "=== dist/ contents ==="
          find dist -type f -exec ls -lh {} +

      # ===================== AUTO-TAG =====================
      # Computes `v<version>-<date>` for this build. The tag itself is not
      # created here: `gh release create --target $GITHUB_SHA` in the publish
      # step auto-creates a missing tag through the REST API. We deliberately
      # avoid `git push` of the tag because GITHUB_TOKEN is a GitHub App token
      # without the `workflows` permission, and GitHub refuses git pushes of
      # tags pointing at commits that modify .github/workflows/*.
      # Skipped when this run was triggered by a pushed tag (that tag is used
      # for the release instead). The auto-tag format must not match the semver
      # `tags:` trigger above, otherwise it would loop the workflow.
      - name: Auto-tag commit
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail

          VERSION=4.19
          DATE=$(date +%Y%m%d%H%M%S)
          TAG="v${VERSION}-${DATE}"

          echo "TAG=${TAG}" >> "$GITHUB_ENV"

      # ===================== PUBLISH dist/ AS A GITHUB RELEASE =====================
      # Create the release FIRST and only upload assets once the release is
      # fully ready: `gh release upload` right after `gh release create` can
      # race the GitHub API and return "HTTP 404: Not Found".
      - name: Publish dist/ to GitHub Releases
        shell: bash

        run: |
          set -euo pipefail
          VERSION=4.19.157
          DATE=$(date +%Y%m%d%H%M%S)
          SHA_SHORT="${GITHUB_SHA::8}"

          # Prefer the pushed tag when the run was triggered by one; otherwise
          # fall back to the auto-generated branch-push tag (from the step above).
          # For branch pushes the tag may not exist yet: `--target $GITHUB_SHA`
          # makes the releases API auto-create it at this exact commit. The
          # fallback keeps the v4.19- format used by the Auto-tag step.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            TARGET_OPT=()
          else
            TAG="${TAG:-v4.19-${DATE}}"
            TARGET_OPT=(--target "$GITHUB_SHA")
          fi

          if ! command -v gh >/dev/null 2>&1; then
            echo "gh CLI not available; skipping release."
            exit 0
          fi

          echo "::group::Creating release ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; deleting and recreating."
            gh release delete "$TAG" --yes >/dev/null
          fi

          NOTES=$(printf '%s\n' \
            "Automated build of commit ${SHA_SHORT} on ${DATE} (NetHunter kernel)." \
            "" \
            "Artifacts:" \
            "- nethunter-kernel-NetHunter.zip — NetHunter AnyKernel3 zip (Image + dtbo.img + modules): flash in TWRP or install as a Magisk Manager module (repacks your boot partition, preserving ramdisk/Magisk; modules installed systemlessly)" \
            "- nethunter-kernel-nairo-magisk.zip — Magisk module zip (install from Magisk Manager or TWRP): repacks the current boot partition with the new kernel at install time, preserving the Magisk patch, and flashes dtbo.img" \
            "- boot.img — Android boot image (header v2): Image + DTB + initramfs; repack with the device ramdisk (magiskboot unpack/repack) before flashing" \
            "- dtbo.img — device tree overlay table (flash to the dtbo partition)" \
            "- linux-headers-*-arm64.deb — DKMS kernel headers for an arm64 Kali chroot (no linux-image dependency)" \
            "- kernel-headers.zip — kernel header files" \
            "- Image.xz — built kernel image" \
            "- initramfs_data.cpio.gz — kernel initramfs")

          # The releases API requires the `workflows` permission (which the
          # GITHUB_TOKEN can never carry) when the commit range from --target
          # to the default-branch HEAD contains changes to .github/workflows/*.
          # That happens when this ~25-min build finishes after a newer push:
          # $GITHUB_SHA is then no longer the branch HEAD and the range spans
          # the workflow changes. If the create fails for any reason, fall back
          # to tagging the *current* default-branch HEAD (empty range), which
          # only needs `contents: write`.
          gh release create "$TAG" \
            --title "Kernel ${VERSION} — ${DATE}" \
            --notes "$NOTES" \
            --latest \
            "${TARGET_OPT[@]}" \
            || {
              echo "[*] release create at ${GITHUB_SHA} failed (workflows-scope rule); retrying at current default-branch HEAD"
              HEAD_SHA=$(git ls-remote --heads origin "${GITHUB_REF_NAME}" | awk '{print $1}')
              echo "[*] fallback target commit: ${HEAD_SHA}"
              gh release create "$TAG" \
                --title "Kernel ${VERSION} — ${DATE}" \
                --notes "$NOTES" \
                --latest \
                --target "$HEAD_SHA"
            }
          # Wait until the freshly created release is visible through the API
          # (uploads can otherwise 404 for a few seconds after creation).
          for i in $(seq 1 15); do
            if gh release view "$TAG" --json id >/dev/null 2>&1; then
              break
            fi
            echo "[*] waiting for release ${TAG} to be ready (${i})..."
            sleep 3
          done
          echo "::endgroup::"

          echo "::group::Uploading artifacts"
          mapfile -t assets < <(find dist -type f 2>/dev/null | sort)
          if (( ${#assets[@]} )); then
            echo "Uploading ${#assets[@]} artifacts from dist/ ..."
            for asset in "${assets[@]}"; do
              name="$(basename "$asset")"
              echo "[*] ${name}"
              ok=0
              for attempt in 1 2 3 4 5; do
                if gh release upload "$TAG" "$asset" --clobber; then
                  ok=1
                  break
                fi
                echo "[-] upload failed (attempt ${attempt}), retrying in 5s..."
                sleep 5
              done
              if (( ! ok )); then
                echo "[-] giving up on ${name} after 5 attempts"
                exit 1
              fi
            done
            ls -lh "${assets[@]}"
          else
            echo "No dist/ content to upload (build may have failed)."
          fi
          echo "::endgroup::"
